services:
  # Servidor estático: publica o conteúdo de src na porta 8080 do computador.
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro

  # Processo de desenvolvimento que recompila o CSS ao detectar alterações.
  tailwind:
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -lc "npm install && npm run dev"
    stdin_open: true
    tty: true
